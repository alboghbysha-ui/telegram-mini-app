<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>مینی اپ من - Monetag</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ✅ کد رسمی Monetag که خودت پیدا کردی -->
  <script src='//libtl.com/sdk.js' data-zone='11122863' data-sdk='show_11122863'></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .box {
      background: rgba(255,255,255,0.95);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
    }
    
    h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }
    
    .score-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
    }
    
    .score-label {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    
    #score {
      font-size: 48px;
      font-weight: bold;
      color: white;
    }
    
    button {
      padding: 14px 28px;
      margin: 10px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    button:active {
      transform: scale(0.97);
    }
    
    button:disabled {
      opacity: 0.6;
      transform: none;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      padding: 8px;
      background: #f0f0f0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🤖 مینی اپ من</h2>
    
    <div class="score-box">
      <div class="score-label">امتیاز شما</div>
      <div id="score">0</div>
    </div>
    
    <button id="rewardBtn">🎁 تماشای تبلیغ + 10 امتیاز</button>
    
    <div class="status" id="status">
      ✅ آماده | روی دکمه سبز کلیک کن
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const rewardBtn = document.getElementById('rewardBtn');
      const scoreSpan = document.getElementById('score');
      const statusDiv = document.getElementById('status');
      let score = 0;
      
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
      
      function waitForMonetag() {
        return new Promise((resolve) => {
          if (typeof show_11122863 !== 'undefined') {
            resolve();
            return;
          }
          
          let attempts = 0;
          const interval = setInterval(() => {
            attempts++;
            if (typeof show_11122863 !== 'undefined') {
              clearInterval(interval);
              resolve();
            } else if (attempts > 30) {
              clearInterval(interval);
              statusDiv.innerHTML = '⚠️ خطا: SDK لود نشد. صفحه رو Refresh کن';
              resolve();
            }
          }, 100);
        });
      }
      
      async function showRewardedAd() {
        await waitForMonetag();
        
        if (typeof show_11122863 === 'undefined') {
          throw new Error('Monetag SDK not loaded');
        }
        
        return show_11122863();
      }
      
      rewardBtn.addEventListener('click', async function() {
        rewardBtn.disabled = true;
        rewardBtn.innerText = '⏳ در حال بارگذاری...';
        statusDiv.innerHTML = '🔄 در حال دریافت تبلیغ...';
        
        try {
          await showRewardedAd();
          
          score += 10;
          scoreSpan.innerText = score;
          statusDiv.innerHTML = '✅ +10 امتیاز! ممنون از دیدن تبلیغ';
          
          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
            Telegram.WebApp.showAlert('🎉 10 امتیاز به حساب تو اضافه شد!');
          }
          
        } catch (error) {
          console.log('Error:', error);
          statusDiv.innerHTML = '⚠️ تبلیغ نمایش داده نشد. دوباره تلاش کن';
          
          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.showAlert('⚠️ تبلیغ نمایش داده نشد، دوباره تلاش کن');
          }
        } finally {
          rewardBtn.disabled = false;
          rewardBtn.innerText = '🎁 تماشای تبلیغ + 10 امتیاز';
          
          setTimeout(() => {
            if (statusDiv.innerHTML.includes('⚠️')) {
              statusDiv.innerHTML = '✅ آماده | روی دکمه سبز کلیک کن';
            }
          }, 2000);
        }
      });
    });
  </script>

</body>
</html>
